<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXT PRONUNCIATION WEB APP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <input type="text" name="" id="text" placeholder="Type something...">

        <button onclick="speak()">
            🔊 Speak
        </button>
    </div>

    <script>
        function speak(){
            speechSynthesis.speak(
                new SpeechSynthesisUtterance(text.value)
            )
        }
    </script>
</body>

</html>
